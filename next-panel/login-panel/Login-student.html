<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNex - Student Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e0f2f7; /* Lighter blue background for a fresh feel */
            margin: 0;
            color: #333;
            overflow: hidden; /* Prevent scrollbar if shapes go out */
        }
        .login-wrapper {
            display: flex;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            max-width: 900px;
            width: 95%;
            overflow: hidden; /* Ensures rounded corners */
            position: relative;
        }
        .login-illustration {
            flex: 1;
            background: linear-gradient(135deg, #2E86C1, #4ECDC4); /* Blue to Teal gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: #fff;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
        }
        .login-illustration::before,
        .login-illustration::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            z-index: 1;
            animation: float 6s ease-in-out infinite;
        }
        .login-illustration::before {
            width: 150px;
            height: 150px;
            top: -50px;
            left: -50px;
            animation-duration: 7s;
        }
        .login-illustration::after {
            width: 200px;
            height: 200px;
            bottom: -70px;
            right: -70px;
            animation-duration: 8s;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .illustration-content {
            z-index: 2;
            padding: 20px;
        }
        .illustration-content svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        .illustration-content h2 {
            font-size: 2.2em;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .illustration-content p {
            font-size: 1.1em;
            opacity: 0.9;
            line-height: 1.6;
        }

        .login-form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-form-section h2 {
            font-size: 2em;
            color: #2E86C1;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 700;
        }
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95em;
        }
        .input-group input[type="email"],
        .input-group input[type="password"] {
            width: calc(100% - 40px); /* Adjust for padding and icon */
            padding: 12px 15px 12px 45px; /* Left padding for icon */
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            color: #333;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Roboto', sans-serif; /* Cleaner font for inputs */
        }
        .input-group input[type="email"]:focus,
        .input-group input[type="password"]:focus {
            border-color: #2E86C1;
            box-shadow: 0 0 0 3px rgba(46, 134, 193, 0.2);
            outline: none;
        }
        .input-group .input-icon {
            position: absolute;
            left: 15px;
            top: 45px; /* Adjust based on label and input height */
            color: #777;
        }
        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 25px;
        }
        .forgot-password a {
            color: #2E86C1;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .forgot-password a:hover {
            color: #1a6ba0;
        }
        .btn-login {
            background-color: #2E86C1;
            color: #fff;
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
            box-shadow: 0 5px 15px rgba(46, 134, 193, 0.3);
        }
        .btn-login:hover {
            background-color: #256bb0;
            transform: translateY(-2px);
        }

        #teacher-login{
            margin-top: 20px;
        }

        .language-toggle {
            text-align: center;
            margin-top: 10px;
        }
        .language-toggle a {
            color: #2E86C1; /* Orange for language link */
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9em;
        }
        .language-toggle a:hover {
            text-decoration: underline;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            body{
                min-height: auto;
            }

            .login-wrapper {
                flex-direction: column;
                max-width: 450px; /* Adjust max-width for smaller screens */
            }
            .login-illustration {
                border-bottom-left-radius: 0;
                border-top-right-radius: 20px;
                padding: 20px;
            }
            .login-illustration::before,
            .login-illustration::after {
                display: none; /* Hide floating shapes on small screens */
            }
            .login-form-section {
                padding: 30px;
            }
            .illustration-content h2 {
                font-size: 1.8em;
            }
            .illustration-content p {
                font-size: 0.95em;
            }
        }
        @media (max-width: 480px) {
            .login-form-section h2 {
                font-size: 1.6em;
                margin-bottom: 20px;
            }
            .input-group input {
                padding: 10px 15px 10px 40px;
            }
            .input-group .input-icon {
                top: 42px;
            }
            .btn-login {
                padding: 12px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body class="animate__animated animate__fadeIn">
    <div class="login-wrapper">
        <div class="login-illustration">
            <div class="illustration-content">
                <i data-feather="book-open"></i>
                <h2>EduNex में आपका स्वागत है!</h2>
                <p>ज्ञान की दुनिया को अनलॉक करें। अपनी सीखने की यात्रा शुरू करने के लिए लॉगिन करें।</p>
            </div>
        </div>
        <div class="login-form-section">
            <h2>छात्र लॉगिन</h2>
            <div class="input-group">
                <label for="student-email">स्कूल ईमेल आईडी</label>
                <i data-feather="at-sign" class="input-icon"></i>
                <input type="email" id="student-email" placeholder="school@edunex.com" required>
            </div>
            <div class="input-group">
                <label for="student-password">पासवर्ड</label>
                <i data-feather="lock" class="input-icon"></i>
                <input type="password" id="student-password" placeholder="********" required>
            </div>
            <div class="forgot-password">
                <a href="#">पासवर्ड भूल गए?</a>
            </div>
            <button class="btn-login">लॉगिन करें</button>
            <div id="teacher-login" class="language-toggle">
                <a href="Teacher-login.HTML">शिक्षक लॉगिन</a>
            </div>
            <div class="language-toggle">
                <a href="../Language-change.HTML" id="change-language-link">भाषा बदलें?</a>
            </div>
        </div>
    </div>

    <script>
        feather.replace();

        // Optional: Add JavaScript for form submission and language change

        document.querySelector('.btn-login').addEventListener('click', function() {
            const email = document.getElementById('student-email').value;
            const password = document.getElementById('student-password').value;

            if (email && password) {
                alert(`लॉगिन करने का प्रयास: ईमेल - ${email}, पासवर्ड - ${password}`);
                // In a real app, send these credentials to your backend for authentication.
                // On successful login, redirect to the student dashboard.
                // window.location.href = 'student_dashboard.html'; // Example redirect
            } else {
                alert('कृपया ईमेल आईडी और पासवर्ड दोनों दर्ज करें।');
            }
        });
    </script>
</body>
</html>
